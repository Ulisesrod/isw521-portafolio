<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Layout Design</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      
      
    }

    .container {
      width: 1100px;
      border: 6px solid #e5e5e5;
      background-color: white;
    }

    /* HEADER */
    header {
      background-color: #1f3b70;
      color: white;
      text-align: center;
      padding: 20px;
      font-size: 24px;
      border-bottom: 6px solid #e5e5e5;
    }

    /* MAIN LAYOUT */
    .content {
      display: grid;
      grid-template-columns: 1fr 2fr 1fr;
      min-height: 400px;
    }

    /* LEFT SIDEBAR */
    .left-sidebar {
      background-color: #4f78c7;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      border-right: 6px solid #e5e5e5;
      text-align: center;
      padding: 20px;
      font-size: 22px;
    }

    /* MAIN CONTENT */
    main {
      background-color: #6da0d3;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      font-size: 22px;
      border-right: 6px solid #e5e5e5;
    }

    /* RIGHT SIDEBAR */
    .right-sidebar {
      background-color: #f1832f;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      font-size: 22px;
    }

    /* FOOTER */
    footer {
      background-color: #162b63;
      color: white;
      text-align: center;
      padding: 18px;
      font-size: 22px;
      border-top: 6px solid #e5e5e5;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .content {
        grid-template-columns: 1fr;
      }

      .left-sidebar,
      main {
        border-right: none;
        border-bottom: 6px solid #e5e5e5;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      &lt;header&gt; logo + &lt;nav&gt;
    </header>

    <div class="content">

      <aside class="left-sidebar">
        <div>
          &lt;aside&gt;<br>
          Filters
        </div>
      </aside>

      <main>
        <article>
        <h1>HTML Semantico - Workshop</h1>
        <p>Recrear el wireframe anterior en HTML5 usando exclusivamente etiquetas semanticas
          Agregar un formulario de busqueda dentro del "header" con label, input[type=search] y button</p>
        </article>
      </main>

      <aside class="right-sidebar">
        <div>
          &lt;aside&gt;<br>
          Related
        </div>
      </aside>

    </div>

    <footer>
      &lt;footer&gt; © UTN 2026
    </footer>

  </div>

</body>
